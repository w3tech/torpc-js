name: Publish decoder

# Manual only: the `prod` environment permits `main`, so a tag cannot deploy.
# The version comes from codec/package.json, never from a ref.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  # The credential. npm exchanges the OIDC token minted here for a short-lived
  # token valid for a single publish, bound on the npm side to this repository,
  # this workflow file and this environment. Nothing is stored in the repository.
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # Requires an approval from the environment's reviewers, and npm accepts the
    # OIDC claim only when it carries this environment.
    environment: prod
    defaults:
      run:
        working-directory: codec

    steps:
      - uses: actions/checkout@v7
      - name: Install pnpm
        uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: "pnpm"
      # One pnpm workspace: install from the root so the lockfile resolves.
      - run: pnpm install --frozen-lockfile
        working-directory: .
      # Mirror CI before publishing.
      - name: Type-check
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Build
        run: pnpm build
      # Node does not strip types inside node_modules, so a package can compile and
      # still be unimportable. Check the packed tarball, not the working tree.
      - name: Smoke-test the packed tarball
        run: |
          set -euo pipefail
          TARBALL="$(pnpm pack --pack-destination "$RUNNER_TEMP" | tail -1)"
          mkdir -p "$RUNNER_TEMP/consume" && cd "$RUNNER_TEMP/consume"
          echo '{"name":"consume","private":true,"type":"module"}' > package.json
          npm install --silent "$TARBALL"
          cat > use.mjs <<'JS'
          import { forward, registry } from '@w3tech.io/torpc-decoder';
          const out = forward('eth_getBlockByNumber', {
            jsonrpc: '2.0', id: 1,
            result: { number: '0x1', gasUsed: '0x5208', hash: '0xabc',
                      logsBloom: '0x' + '00'.repeat(256) },
          });
          if (!out || typeof out.result !== 'object') throw new Error('forward returned nothing usable');
          if ('logsBloom' in out.result) throw new Error('logsBloom survived the mapping');
          if (registry.size === 0) throw new Error('method registry is empty');
          console.log('ok: importable,', registry.size, 'methods');
          JS
          node use.mjs
      # `--provenance` is the default under trusted publishing; passing it keeps the
      # intent readable and survives a change of default. It works here because the
      # manifest's `repository` names this repository, which is public and is where
      # the publish runs: npm requires all three to line up.
      - run: npm publish --access public --provenance
